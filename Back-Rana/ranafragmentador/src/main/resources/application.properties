spring.application.name=ranafragmentador

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/rana_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Pokemones15-
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: crea/actualiza las tablas automaticamente segun tus @Entity
